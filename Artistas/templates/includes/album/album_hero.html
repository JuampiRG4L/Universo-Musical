{% load i18n %}

<section class="album-hero">

    <div>

        {% if album.cover %}

            <img
                src="{{ album.cover.url }}"
                alt="{{ album.title }}"
            >

        {% endif %}

    </div>

    <div>

        <h1>

            {{ album.title }}

        </h1>

        <p>

            <strong>{% translate "Fecha de lanzamiento" %}:</strong>
            {{ album.formatted_release_date }}

        </p>

        <p>

            {{ album.description }}

        </p>

    </div>

</section>
