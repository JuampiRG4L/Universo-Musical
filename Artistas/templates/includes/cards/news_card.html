<article class="news-card">

{% load i18n %}


<div>


{% if item.image %}

<img

src="{{ item.image.url }}"

alt="{{ item.title }}"

>

{% endif %}



</div>



<div>



<h2>

{{ item.title }}

</h2>



<p>

<strong>{% translate "Publicado el" %}:</strong>
{{ item.formatted_publication_date }}

</p>



<p>

{{ item.description }}

</p>



</div>



</article>
