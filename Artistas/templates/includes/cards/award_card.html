<article class="award-card">

{% load i18n %}


<div>


{% if award.image %}


<img

src="{{ award.image.url }}"

alt="{{ award.name }}"

>


{% endif %}


</div>



<div>


<h2>

{{ award.name }}

</h2>



<p>

<strong>{% translate "Fecha del premio" %}:</strong>
{{ award.formatted_award_date }}

</p>



<p>

{{ award.description }}

</p>


</div>



</article>
